name: Validate key-generation capture

on:
  push:
    paths:
      - 'src/keygen_wots_sequence_capture.py'
      - 'src/prf_capture_core.py'
      - 'src/random_address_capture.py'
      - 'notebooks/03_keygen_wots_prf_capture.ipynb'
      - 'tests/test_keygen_wots_capture.py'
      - '.github/workflows/validate-keygen.yml'
  pull_request:
    paths:
      - 'src/keygen_wots_sequence_capture.py'
      - 'src/prf_capture_core.py'
      - 'src/random_address_capture.py'
      - 'notebooks/03_keygen_wots_prf_capture.ipynb'
      - 'tests/test_keygen_wots_capture.py'
      - '.github/workflows/validate-keygen.yml'

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: python -m pip install numpy tqdm nbformat
      - name: Run keygen WOTS_PRF offline checks
        run: python tests/test_keygen_wots_capture.py
      - name: Validate all notebooks
        run: python tests/test_notebook_format.py
