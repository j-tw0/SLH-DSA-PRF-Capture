name: Validate notebooks

on:
  push:
    paths:
      - 'notebooks/**'
      - 'tests/test_notebook_format.py'
      - '.github/workflows/validate-notebooks.yml'
  pull_request:
    paths:
      - 'notebooks/**'
      - 'tests/test_notebook_format.py'
      - '.github/workflows/validate-notebooks.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install nbformat
      - run: python tests/test_notebook_format.py
